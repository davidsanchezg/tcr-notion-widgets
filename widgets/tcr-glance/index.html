<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TCR open glance</title>
<style>
  :root{--bg:#fff;--ink:#37352f;--muted:#787774;--line:#e9e9e7;--card:#f7f6f3;
    --blue:#2383e2;--green:#0f7b6c;--orange:#d9730d;--purple:#9065b0;--red:#e03e3e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
  #app{height:100%;max-height:280px;padding:8px 10px 8px;
    display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .kpi{flex:0 0 auto;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;line-height:1.2}
  .kpi b{color:var(--ink);font-weight:650}
  .row{flex:1;min-height:0;display:flex;gap:8px;overflow:hidden}
  .cell{flex:1 1 0;min-width:0;min-height:0;background:var(--card);border:1px solid var(--line);
    border-radius:8px;display:flex;flex-direction:column;overflow:hidden;padding:6px 8px 6px}
  .lab{flex:0 0 auto;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
  .stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .stage > svg,.stage > canvas{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block}
  .legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px;max-height:28px;overflow:hidden}
  .legend span{font-size:9px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:2px;display:inline-block;flex:0 0 auto}
  .gcap{flex:0 0 auto;text-align:center;padding-top:2px;line-height:1.15}
  .gcap .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .gcap .s{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div id="app">
  <div class="kpi" id="kpi"></div>
  <div class="row">
    <div class="cell">
      <div class="lab">Líneas por estado</div>
      <div class="stage" id="donut"></div>
      <div class="legend" id="donutLeg"></div>
    </div>
    <div class="cell">
      <div class="lab">Activas por seat</div>
      <div class="stage" id="bars"></div>
    </div>
    <div class="cell">
      <div class="lab">Líneas · Necesita Operador</div>
      <div class="stage" id="gauge"></div>
    </div>
  </div>
</div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const split=(k,d)=> (p.get(k)||d).split(',').map(s=>decodeURIComponent(s.trim())).filter(Boolean);
  const nums=(k,d)=> split(k,d).map(Number);
  const stateLabels=split('states','En curso,Planeado');
  const stateVals=nums('stateVals','6,1');
  const seatLabels=split('seats','Cryptor,unknown');
  const seatVals=nums('seatVals','4,3');
  const cardsOpen=Number(p.get('cards')??0);
  const needs=Number(p.get('needs')??1);
  const active=Number(p.get('active')?? stateVals.reduce((a,b)=>a+b,0));
  const dur=Math.max(500,Number(p.get('duration')||1400));
  const colors=['#2383e2','#d9730d','#9065b0','#0f7b6c','#e03e3e','#529cca','#9b9a97'];
  const ease=t=>1-Math.pow(1-t,3);
  const t0=performance.now();

  document.getElementById('kpi').innerHTML=
    `<span>Tarjetas abiertas <b>${cardsOpen}</b></span>`+
    `<span>Necesita Operador <b>${needs}</b></span>`+
    `<span>Líneas activas <b>${active}</b></span>`;

  // --- Donut ---
  const donutHost=document.getElementById('donut');
  const totalStates=Math.max(1,stateVals.reduce((a,b)=>a+b,0));
  donutHost.innerHTML=`<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g id="segs" transform="rotate(-90 60 60)"></g>
    <text x="60" y="56" text-anchor="middle" fill="#787774" font-size="9">líneas</text>
    <text id="donutN" x="60" y="74" text-anchor="middle" fill="#37352f" font-size="22" font-weight="700">0</text>
  </svg>`;
  const segsG=donutHost.querySelector('#segs');
  const r=42, C=2*Math.PI*r, stroke=14;
  stateVals.forEach((v,i)=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('class','seg');
    el.setAttribute('cx','60'); el.setAttribute('cy','60'); el.setAttribute('r',String(r));
    el.setAttribute('fill','none');
    el.setAttribute('stroke',colors[i%colors.length]);
    el.setAttribute('stroke-width',String(stroke));
    el.setAttribute('stroke-dasharray',`0 ${C}`);
    el.setAttribute('stroke-dashoffset','0');
    segsG.appendChild(el);
  });
  const segs=[...segsG.querySelectorAll('.seg')];
  document.getElementById('donutLeg').innerHTML=stateLabels.map((l,i)=>
    `<span><i class="dot" style="background:${colors[i%colors.length]}"></i>${l} ${stateVals[i]||0}</span>`).join('');

  // --- Bars ---
  const barsHost=document.getElementById('bars');
  const maxSeat=Math.max(1,...seatVals);
  barsHost.innerHTML=`<div style="display:flex;align-items:flex-end;gap:6px;height:100%;padding:4px 2px 0" id="barRow"></div>`;
  const barRow=document.getElementById('barRow');
  const barEls=seatLabels.map((lab,i)=>{
    const col=document.createElement('div');
    col.style.cssText='flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0';
    col.innerHTML=`<div class="b" style="width:100%;max-width:48px;border-radius:5px 5px 2px 2px;background:${colors[i%colors.length]};height:0%;min-height:0"></div>
      <div style="font-size:10px;font-weight:650;font-variant-numeric:tabular-nums" class="n">0</div>
      <div style="font-size:9px;color:#787774;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${lab}</div>`;
    barRow.append(col);
    return {b:col.querySelector('.b'),n:col.querySelector('.n'),v:seatVals[i]||0};
  });

  // --- Gauge: horseshoe fully inside viewBox; caption under ring ---
  const gHost=document.getElementById('gauge');
  gHost.innerHTML=`
    <svg viewBox="0 0 120 78" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="flex:1 1 auto;min-height:0;width:100%">
      <path id="gTrack" fill="none" stroke="#ecebea" stroke-width="12" stroke-linecap="round"/>
      <path id="gFill" fill="none" stroke="#0f7b6c" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 999"/>
    </svg>
    <div class="gcap"><div class="n" id="gn">0</div><div class="s" id="gs">${needs} de ${active} líneas</div></div>`;

  // Arc from 200° to 340° (open at bottom), center (60,58), r=40 — fits in 120x78
  const gx=60, gy=58, gR=40;
  const a0=Math.PI*200/180, a1=Math.PI*340/180;
  function polar(a){return [gx+gR*Math.cos(a), gy+gR*Math.sin(a)]}
  const [x0,y0]=polar(a0), [x1,y1]=polar(a1);
  const arcLen=gR*(a1-a0);
  const track=document.getElementById('gTrack');
  const fill=document.getElementById('gFill');
  const d=`M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${gR} ${gR} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  track.setAttribute('d',d);
  fill.setAttribute('d',d);
  fill.setAttribute('stroke-dasharray',`0 ${arcLen}`);

  function frame(now){
    const t=Math.min(1,(now-t0)/dur), e=ease(t);
    let off=0;
    segs.forEach((el,i)=>{
      const full=C*((stateVals[i]||0)/totalStates);
      const len=full*e;
      el.setAttribute('stroke-dasharray', `${len} ${C}`);
      el.setAttribute('stroke-dashoffset', String(-off));
      off+=len;
    });
    document.getElementById('donutN').textContent=String(Math.round(totalStates*e));
    barEls.forEach(b=>{
      b.b.style.height=(e*(b.v/maxSeat)*100)+'%';
      b.n.textContent=String(Math.round(e*b.v));
    });
    const nv=Math.round(e*needs);
    document.getElementById('gn').textContent=String(nv);
    const pct=active? Math.min(1, (e*needs)/active):0;
    fill.setAttribute('stroke', pct>0.5?'#e03e3e':(pct>0?'#d9730d':'#0f7b6c'));
    fill.setAttribute('stroke-dasharray', `${(arcLen*pct).toFixed(2)} ${arcLen.toFixed(2)}`);
    if(t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
