<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>multi-ring</title>
<!-- theme-resolver:start (identical on every page; checked by scripts/verify-theme.sh) -->
<script>
(function(){
  var root=document.documentElement;
  var qs=new URLSearchParams(location.search);
  var hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  function param(k){var v=qs.get(k);if(v===null)v=hs.get(k);return v===null?'':String(v).toLowerCase();}
  var lock=null, v=param('theme')||param('mode');
  if(v==='light'||v==='dark')lock=v;
  else if(v==='auto'||v==='system')lock='auto';
  else{var d=param('dark');if(d==='1'||d==='true')lock='dark';else if(d==='0'||d==='false')lock='light';}
  var locked=(lock==='light'||lock==='dark');
  var mq=(typeof window.matchMedia==='function')?window.matchMedia('(prefers-color-scheme: dark)'):null;
  var msgTheme=null;
  function resolved(){
    if(locked)return lock;
    if(msgTheme)return msgTheme;
    return(mq&&mq.matches)?'dark':'light';
  }
  function apply(){
    var t=resolved();
    root.dataset.theme=t;
    root.dataset.themeMode=locked?lock:'auto';
    root.style.colorScheme=t;
    window.dispatchEvent(new CustomEvent('tcr-theme',{detail:t}));
  }
  apply();
  if(mq){
    var onMedia=function(){msgTheme=null;apply();};
    if(mq.addEventListener)mq.addEventListener('change',onMedia);
    else if(mq.addListener)mq.addListener(onMedia);
  }
  // Defensive: only Notion origins; ignored when the URL locks light/dark.
  var TRUSTED=/^https:\/\/([a-z0-9-]+\.)?(notion\.so|notion\.site)$/;
  window.addEventListener('message',function(e){
    if(locked||!TRUSTED.test(String(e.origin)))return;
    var d=e.data,t=null;
    if(d&&typeof d==='object'){
      if(d.theme==='dark'||d.theme==='light')t=d.theme;
      else if(typeof d.darkMode==='boolean')t=d.darkMode?'dark':'light';
    }
    if(!t)return;
    msgTheme=t;apply();
  });
})();
</script>
<!-- theme-resolver:end -->
<style>
/* theme-tokens:start */
:root,:root[data-theme="light"]{--bg:#ffffff;--card:#f7f6f3;--line:#e9e9e7;--track:#ecebea;--ink:#37352f;--muted:#787774;color-scheme:light}
:root[data-theme="dark"]{--bg:#191919;--card:#202020;--line:#373737;--track:#2f2f2f;--ink:#e6e6e6;--muted:#9b9b9b;color-scheme:dark}
/* theme-tokens:end */
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
  #root{box-sizing:border-box;width:100%;height:100%;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-content:center}
  .cell{display:grid;place-items:center;min-height:0}
  svg{display:block;max-width:100%;height:auto}
  .track{stroke:var(--track)}
  .lab{fill:var(--muted);font-size:9px;letter-spacing:.03em;text-transform:uppercase}
  .val{fill:var(--ink);font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const n=Math.max(2,Math.min(12,Number(p.get('n')||6)));
  const colors=(p.get('colors')||'#2383e2,#0f7b6c,#d9730d,#9065b0,#e03e3e,#529cca').split(',');
  let vals;
  if(p.get('values')) vals=p.get('values').split(',').map(Number).slice(0,n);
  else {
    const seed=Number(p.get('seed')||7);
    let s=seed>>>0; const rnd=()=>{s=(s*1664525+1013904223)>>>0; return (s%1000)/1000};
    vals=Array.from({length:n},()=>Math.round(20+rnd()*75));
  }
  while(vals.length<n) vals.push(50);
  const labels=(p.get('labels')||'').split(',').filter(Boolean);
  const dur=Math.max(400,Number(p.get('duration')||2200));
  const root=document.getElementById('root');
  const rings=vals.map((target,i)=>{
    const size=118, stroke=9, r=(size-stroke)/2-1, c=2*Math.PI*r;
    const lab=labels[i]||('K'+(i+1));
    const cell=document.createElement('div'); cell.className='cell';
    cell.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text class="lab" x="${size/2}" y="${size/2-8}" text-anchor="middle">${lab}</text>
      <text class="num val" x="${size/2}" y="${size/2+12}" text-anchor="middle">0</text>
    </svg>`;
    root.append(cell);
    return {arc:cell.querySelector('.arc'), num:cell.querySelector('.num'), target, c};
  });
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,3)}
  function frame(now){
    const t=Math.min(1,(now-t0)/dur), e=ease(t);
    rings.forEach(r=>{
      const v=e*r.target;
      r.arc.style.strokeDashoffset=String(r.c*(1-v/100));
      r.num.textContent=String(Math.round(v));
    });
    if(t<1) requestAnimationFrame(frame);
    else if(p.get('loop')==='1'){ /* soft pulse loop for stress */ location.replace(location.pathname+location.search.replace(/([?&])_=\d+/,'$1').replace(/[?&]$/,'')+(location.search?'&':'?')+'_='+Date.now()+location.hash); }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
