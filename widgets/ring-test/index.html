<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ring-test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ffffff;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
  #root{width:100%;height:100%;display:grid;place-items:center}
  svg{display:block}
  .label{fill:#787774;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .val{fill:#37352f;font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const target=Math.max(0,Math.min(100,Number(p.get('value')??p.get('target')??72)));
  const color=p.get('color')||'#2383e2';
  const label=p.get('label')||'Progress';
  const dur=Math.max(400,Number(p.get('duration')||1800));
  const size=Math.min(innerWidth,innerHeight)*0.86|0;
  const stroke=Math.max(8,size*0.08|0);
  const r=(size-stroke)/2-2;
  const c=2*Math.PI*r;
  const root=document.getElementById('root');
  root.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ecebea" stroke-width="${stroke}"/>
    <circle id="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text class="label" x="${size/2}" y="${size/2-18}" text-anchor="middle">${label}</text>
    <text id="num" class="val" x="${size/2}" y="${size/2+14}" text-anchor="middle">0</text>
  </svg>`;
  const arc=document.getElementById('arc');
  const num=document.getElementById('num');
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,3)}
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    const v=ease(t)*target;
    arc.style.strokeDashoffset=String(c*(1-v/100));
    num.textContent=String(Math.round(v));
    if(t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
