<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>ring-test</title>
<!-- theme-resolver:start (identical on every page; checked by scripts/verify-theme.sh) -->
<script>
(function(){
  var root=document.documentElement;
  var qs=new URLSearchParams(location.search);
  var hs=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  function param(k){var v=qs.get(k);if(v===null)v=hs.get(k);return v===null?'':String(v).toLowerCase();}
  var lock=null, v=param('theme')||param('mode');
  if(v==='light'||v==='dark')lock=v;
  else if(v==='auto'||v==='system')lock='auto';
  else{var d=param('dark');if(d==='1'||d==='true')lock='dark';else if(d==='0'||d==='false')lock='light';}
  var locked=(lock==='light'||lock==='dark');
  var mq=(typeof window.matchMedia==='function')?window.matchMedia('(prefers-color-scheme: dark)'):null;
  var msgTheme=null;
  function resolved(){
    if(locked)return lock;
    if(msgTheme)return msgTheme;
    return(mq&&mq.matches)?'dark':'light';
  }
  function apply(){
    var t=resolved();
    root.dataset.theme=t;
    root.dataset.themeMode=locked?lock:'auto';
    root.style.colorScheme=t;
    window.dispatchEvent(new CustomEvent('tcr-theme',{detail:t}));
  }
  apply();
  if(mq){
    var onMedia=function(){msgTheme=null;apply();};
    if(mq.addEventListener)mq.addEventListener('change',onMedia);
    else if(mq.addListener)mq.addListener(onMedia);
  }
  // Defensive: only Notion origins; ignored when the URL locks light/dark.
  var TRUSTED=/^https:\/\/([a-z0-9-]+\.)?(notion\.so|notion\.site)$/;
  window.addEventListener('message',function(e){
    if(locked||!TRUSTED.test(String(e.origin)))return;
    var d=e.data,t=null;
    if(d&&typeof d==='object'){
      if(d.theme==='dark'||d.theme==='light')t=d.theme;
      else if(typeof d.darkMode==='boolean')t=d.darkMode?'dark':'light';
    }
    if(!t)return;
    msgTheme=t;apply();
  });
})();
</script>
<!-- theme-resolver:end -->
<style>
/* theme-tokens:start */
:root,:root[data-theme="light"]{--bg:#ffffff;--card:#f7f6f3;--line:#e9e9e7;--track:#ecebea;--ink:#37352f;--muted:#787774;color-scheme:light}
:root[data-theme="dark"]{--bg:#191919;--card:#202020;--line:#373737;--track:#2f2f2f;--ink:#e6e6e6;--muted:#9b9b9b;color-scheme:dark}
/* theme-tokens:end */
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
  #root{width:100%;height:100%;display:grid;place-items:center}
  svg{display:block}
  .track{stroke:var(--track)}
  .label{fill:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .val{fill:var(--ink);font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const target=Math.max(0,Math.min(100,Number(p.get('value')??p.get('target')??72)));
  const color=p.get('color')||'#2383e2';
  const label=p.get('label')||'Progress';
  const dur=Math.max(400,Number(p.get('duration')||1800));
  const size=Math.min(innerWidth,innerHeight)*0.86|0;
  const stroke=Math.max(8,size*0.08|0);
  const r=(size-stroke)/2-2;
  const c=2*Math.PI*r;
  const root=document.getElementById('root');
  root.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle id="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text class="label" x="${size/2}" y="${size/2-18}" text-anchor="middle">${label}</text>
    <text id="num" class="val" x="${size/2}" y="${size/2+14}" text-anchor="middle">0</text>
  </svg>`;
  const arc=document.getElementById('arc');
  const num=document.getElementById('num');
  const t0=performance.now();
  function ease(t){return 1-Math.pow(1-t,3)}
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    const v=ease(t)*target;
    arc.style.strokeDashoffset=String(c*(1-v/100));
    num.textContent=String(Math.round(v));
    if(t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
